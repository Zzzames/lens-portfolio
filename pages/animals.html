<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动物摄影</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../styles/enhanced-animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;700&family=Helvetica+Neue:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="../config/image-loading-config.js"></script>
    <script src="../scripts/unified-image-loader.js"></script>
    <script src="../scripts/navbar-scroll.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="../index.html" class="nav-link">首页</a></li>
            <li><a href="portfolio.html" class="nav-link">作品集</a></li>
            <li><a href="journal.html" class="nav-link">札记</a></li>
        </ul>
    </nav>

    <!-- 作品展示页面 -->
    <section class="gallery-page">
        <div class="container">
            <div class="gallery-header">
                <h1 class="gallery-title">动物摄影</h1>
                <p class="gallery-description">捕捉生灵的自然姿态与灵动瞬间</p>
            </div>
            
            <div class="photo-grid">
                <!-- 图片将通过优化加载器动态加载 -->
            </div>
            
            <!-- 分页容器将自动生成 -->
            
            <!-- 底部返回按钮 -->
            <div class="gallery-footer">
                <a href="portfolio.html" class="back-button-bottom">← 返回作品集</a>
            </div>
        </div>
    </section>

    <script>
        // 初始化动物摄影画廊 - 使用统一加载器
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，开始初始化动物摄影画廊...');
            
            // 检查统一加载器是否可用
            if (typeof UnifiedImageLoader === 'undefined' || !window.unifiedLoader) {
                console.error('UnifiedImageLoader 未找到');
                const photoGrid = document.querySelector('.photo-grid');
                if (photoGrid) {
                    photoGrid.innerHTML = `
                        <div class="error-state">
                            <div class="error-icon">⚠️</div>
                            <h3>加载器错误</h3>
                            <p>图片加载器未正确初始化</p>
                            <button onclick="location.reload()" class="retry-btn">刷新页面</button>
                        </div>
                    `;
                }
                return;
            }
            
            // 使用统一加载器初始化画廊
            window.unifiedLoader.initializeGallery('animals')
                .then(() => {
                    console.log('动物摄影画廊初始化成功');
                })
                .catch(error => {
                    console.error('初始化画廊失败:', error);
                });
        });
    </script>
</body>
</html>
